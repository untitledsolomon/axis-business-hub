name: Check Supabase migrations sync

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm install -g supabase jq

      - name: Login to Supabase
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then echo "SUPABASE_ACCESS_TOKEN not set"; exit 1; fi
          supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: List remote migrations
        id: remote
        run: |
          if [ -z "${SUPABASE_PROJECT_REF}" ]; then echo "SUPABASE_PROJECT_REF not set"; exit 1; fi
          supabase migrations list --project-ref "$SUPABASE_PROJECT_REF" --json > remote_migrations.json
          cat remote_migrations.json

      - name: Compare remote vs local
        run: |
          jq -r '.[].name' remote_migrations.json | sort > /tmp/remote_names.txt || true
          ls supabase/migrations | sort > /tmp/local_names.txt || true
          echo "Remote migrations:" && cat /tmp/remote_names.txt || true
          echo "Local migrations:" && cat /tmp/local_names.txt || true
          comm -23 /tmp/remote_names.txt /tmp/local_names.txt > /tmp/missing.txt || true
          if [ -s /tmp/missing.txt ]; then
            echo "ERROR: There are remote migrations not present locally:" 
            cat /tmp/missing.txt
            exit 2
          fi
          echo "All remote migrations are present locally."

      - name: Success
        if: success()
        run: echo "Supabase migrations are in sync."
