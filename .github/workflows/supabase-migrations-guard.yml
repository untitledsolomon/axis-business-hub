name: Check Supabase migrations sync

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check migrations directory exists
        run: |
          if [ ! -d "supabase/migrations" ]; then
            echo "ERROR: supabase/migrations directory not found"
            exit 1
          fi
          echo "✓ Migrations directory exists"

      - name: Verify migration file naming
        run: |
          cd supabase/migrations
          failed=0
          for file in *.sql; do
            # Check if filename matches YYYYMMDDHHMMSS_name.sql pattern
            if ! echo "$file" | grep -qE '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
              echo "ERROR: Invalid migration filename format: $file"
              echo "Expected format: YYYYMMDDhhmmss_name.sql"
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            exit 1
          fi
          echo "✓ All migration files follow correct naming convention"

      - name: List local migrations
        run: |
          echo "Local migrations:"
          ls -1 supabase/migrations/*.sql | xargs -n1 basename

